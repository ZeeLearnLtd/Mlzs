<section>
    <div class="sitemap-section">
        <div class="sitemap-wrapper">
            <!-- Header & Search Bar -->
            <header class="sitemap-header">
       <div><h1 class="text2">Sitemap</h1></div>
        
        <!-- <p>Find quick shortcuts to all pages, features, resources, and regional locations.</p>

        <div class="search-container">
        <span class="search-icon">🔍</span>
        <input 
            type="text" 
            [(ngModel)]="searchQuery" 
            placeholder="Type to filter sitemap tiles..." 
            class="search-input"
        />
        <button *ngIf="searchQuery" (click)="searchQuery = ''" class="clear-search">✕</button>
        </div> -->
    </header>

            <!-- Loading State -->
            <div *ngIf="isLoading" class="sitemap-status-box">
                <div class="spinner"></div>
                <p>Loading sitemap tiles...</p>
            </div>

            <!-- Error State -->
            <div *ngIf="hasError && !isLoading" class="sitemap-status-box error-box">
                <p>⚠️ Failed to load sitemap tiles.</p>
                <button (click)="fetchSitemap()" class="retry-btn">Retry</button>
            </div>

            <!-- No Results State -->
            <div *ngIf="!isLoading && !hasError && filteredCategories.length === 0" class="sitemap-status-box">
                <p class="no-results">No tiles found matching "<strong>{{ searchQuery }}</strong>"</p>
                <button (click)="searchQuery = ''" class="retry-btn">Clear Search</button>
            </div>

            <!-- Tile Grid Layout -->
            <div *ngIf="!isLoading && !hasError && filteredCategories.length > 0" class="tiles-grid">
                <div *ngFor="let group of filteredCategories" class="sitemap-tile">

                    <!-- Tile Header with Clickable Heading -->
                    <div class="tile-header">
                        <div class="tile-title-group">
                            <span class="tile-icon" *ngIf="!group.isNested">📁</span>
                            <span class="tile-icon" *ngIf="group.isNested">📍</span>

                            <!-- 🌟 Clickable Category Heading -->
                            <!-- Option A: If you want it to route to a base category page like /pages or /blog -->
                            <a [routerLink]="['/' + group.categoryName.toLowerCase()]" class="category-heading-link">
                                <h2>{{ group.categoryName }}</h2>
                            </a>
                        </div>
                        <span class="tile-count" *ngIf="!group.isNested">{{ group.links?.length || 0 }}</span>
                    </div>

                    <!-- Standard Links Tile Content -->
                    <div *ngIf="!group.isNested" class="tile-links-container">
                        <ng-container *ngFor="let link of group.links">

                            <!-- External Links -->
                            <a *ngIf="link.isExternal; else internalLink" [href]="link.url" target="_blank"
                                rel="noopener noreferrer" class="sub-tile-link">
                                <span class="link-text">{{ link.title }}</span>
                                <span class="link-arrow">↗</span>
                            </a>

                            <!-- Internal Links -->
                            <ng-template #internalLink>
                                <a [routerLink]="[link.url]" class="sub-tile-link">
                                    <span class="link-text">{{ link.title }}</span>
                                    <span class="link-arrow">→</span>
                                </a>
                            </ng-template>

                        </ng-container>
                    </div>

                    <!-- Nested Regional Hubs Tile Content -->
                    <div *ngIf="group.isNested" class="tile-nested-container">
                        <div *ngFor="let subGroup of group.subGroups" class="city-tile-group">

                            <!-- Optional: If you also want city sub-headings to be clickable, you can wrap them too -->


                            <h3 class="city-tile-title">
                                <a [href]="[subGroup.cityUrl]" class="city-heading-link">{{ subGroup.subCategoryName
                                    }}</a>
                            </h3>



                            <div class="city-links-grid">
                                <a *ngFor="let link of subGroup.links" [href]="[link.url]"
                                    class="sub-tile-link city-link-item">
                                    <span class="link-text">{{ link.title }}</span>
                                    <span class="link-arrow">→</span>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
